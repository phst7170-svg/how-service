<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="timecheck/icon-192.png">
<title>HOW_Service</title>
<style>
/* Layout: black title band, then one card per tool (stacks on phones) */
@font-face{font-family:"Paperlogy";src:url("timecheck/fonts/Paperlogy-800.woff2") format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"SCDream";src:url("timecheck/fonts/SCDream-300.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"SCDream";src:url("timecheck/fonts/SCDream-600.woff2") format("woff2");font-weight:600;font-display:swap}
:root{
  --bg:#f4f3ef; --panel:#ffffff; --fg:#1c1b19; --muted:#6a655d; --line:#e1ddd4;
  --band:#0a0a0b; --band-fg:#f3f2ef; --band-muted:#a3a3a9; --accent:#f5c84c; --accent-fg:#141107;
  --font:"SCDream","Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --font-title:"Paperlogy","SCDream",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:300;line-height:1.55}
.band{background:var(--band);color:var(--band-fg);padding:40px max(16px,env(safe-area-inset-left,0px)) 36px max(16px,env(safe-area-inset-right,0px))}
.band .in,main{max-width:960px;margin:0 auto}
.band h1{margin:0;font-family:var(--font-title);font-weight:800;font-size:clamp(30px,6vw,46px);letter-spacing:.01em}
.band p{margin:6px 0 0;color:var(--band-muted);font-size:15px}
main{padding:28px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
a.tool{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.tool:hover{border-color:var(--fg);transform:translateY(-2px)}
a.tool:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tool .tag{align-self:flex-start;font-family:var(--font-title);font-weight:800;font-size:12px;letter-spacing:.08em;background:var(--band);color:var(--accent);padding:3px 9px;border-radius:999px}
.tool h2{margin:0;font-family:var(--font-title);font-weight:800;font-size:26px}
.tool p{margin:0;color:var(--muted);font-size:14.5px}
.tool ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
.tool .go{margin-top:auto;padding-top:6px;font-family:var(--font-title);font-weight:800;font-size:15px}
.tool .go::after{content:" →"}
footer{max-width:960px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:12.5px}
@media (prefers-reduced-motion:reduce){a.tool{transition:none}a.tool:hover{transform:none}}
</style>
</head>
<body>
<header class="band"><div class="in">
  <h1>HOW_Service</h1>
  <p>섬김팀 경배와 찬양 도구 모음</p>
</div></header>
<main>
  <a class="tool" href="conti/">
    <span class="tag">PC</span>
    <h2>콘티</h2>
    <p>인도자 콘티를 붙여넣고 악보 사진을 올리면 팀 양식대로 장을 나눠 줘요.</p>
    <ul>
      <li>날짜·인도자·곡·키·진행 자동 채우기</li>
      <li>악보 자르기·지우기·줄 빼기, 장마다 곡 수 지정</li>
      <li>PPT·JPG·PDF 저장, 날짜별 보관함</li>
    </ul>
    <span class="go">콘티 만들기</span>
  </a>
  <a class="tool" href="timecheck/">
    <span class="tag">휴대폰</span>
    <h2>타임체크</h2>
    <p>콘티와 스톱워치 기록으로 경배와 찬양 타임체크를 만들어요.</p>
    <ul>
      <li>곡별 시간 기록</li>
      <li>휴대폰에 앱처럼 설치 가능</li>
    </ul>
    <span class="go">타임체크 열기</span>
  </a>
</main>
<footer>작업 내용은 각자의 브라우저에만 저장돼요. 서버로 올라가지 않아요.</footer>
</body>
</html>
